name: Blender-Bauteilbibliothek kostenlos pruefen

on:
  push:
    branches: [main]
    paths:
      - 'scripts/blender_lib/**'
      - 'scripts/blender_worker.py'
      - '.github/workflows/blender-library-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4
      - name: Ubuntu Python 3.12 benutzen, wie in der Production-Pipeline
        run: |
          /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3,12)'
      - name: Headless Blender und Python NumPy installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-venv libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
      - name: Blender-Version, Bibliothek und Blender-Python prüfen
        run: |
          /usr/bin/python3 -m venv .agent_venv
          .agent_venv/bin/python -c 'import sys; assert sys.prefix != sys.base_prefix'
          blender --version | head -n 1 | grep -E 'Blender 4\.'
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONUSERBASE -u VIRTUAL_ENV \
            PYTHONPATH=/usr/lib/python3/dist-packages \
            blender --background --factory-startup --python-exit-code 37 \
            --python-expr 'import bpy, numpy; print("BLENDER_NUMPY_OK", numpy.__version__)'
          python3 -m py_compile scripts/blender_lib/building_kit.py scripts/blender_lib/smoke_test.py
      - name: Echte Geometrie, metrische UVs und GLB-Roundtrip ohne Claude testen
        run: |
          set -o pipefail
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONUSERBASE -u VIRTUAL_ENV \
            PYTHONPATH=/usr/lib/python3/dist-packages \
            timeout 180s blender --background --factory-startup --python-exit-code 37 \
            --python scripts/blender_lib/smoke_test.py | tee /tmp/building-kit-test.log
          grep -F BUILDING_KIT_SMOKE_OK /tmp/building-kit-test.log
      - name: Echten Produktionsworker exportieren und reimportieren lassen
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/worker-test"
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONUSERBASE -u VIRTUAL_ENV \
            PYTHONPATH=/usr/lib/python3/dist-packages \
            WORKER_MODE=export ASSET_WORK="$RUNNER_TEMP/worker-test" \
            GLB_PATH="$RUNNER_TEMP/worker-test/test.glb" \
            STAGE_REPORT="$RUNNER_TEMP/worker-test/report.json" MAX_TRIS=150000 \
            timeout 180s blender --background --factory-startup --python-exit-code 37 \
            "$RUNNER_TEMP/building-kit-worker-source.blend" \
            --python scripts/blender_worker.py | tee /tmp/production-worker-test.log
          grep -F EXPORT_REIMPORT_OK /tmp/production-worker-test.log
