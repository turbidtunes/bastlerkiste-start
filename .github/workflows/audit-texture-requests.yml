name: View unidentified texture uploads
on:
  push:
    branches:
      - audit/texture-requests-20261022
    paths:
      - '.github/workflows/audit-texture-requests.yml'
      - 'scripts/audit_texture_uploads.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install image inspection support (no image generation)
        run: |
          python3 -m pip install --user --break-system-packages --disable-pip-version-check --timeout 20 --retries 1 'pillow>=10,<13'
      - name: Generate contact sheets and source metadata
        run: python3 scripts/audit_texture_uploads.py
      - name: Save viewable audit data on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texture_requests/_audit
          if ! git diff --cached --quiet; then
            git commit -m 'Inventory uploaded textures for visual matching'
            git push origin HEAD:audit/texture-requests-20261022
          fi
