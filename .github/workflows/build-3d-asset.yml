name: Claude Blender Gebaeude automatisch bauen

on:
  workflow_dispatch:
    inputs:
      building_name:
        description: "Zielname (lower_snake_case)"
        required: true
        type: string
        default: "grand_fond_parish_church"
      resume_run_id:
        description: "Optional: GitHub-Actions-Run-ID eines fehlgeschlagenen Builds mit Checkpoints (spart Claude-Tokens)"
        required: false
        type: string
      prompt_path:
        description: "Pfad zum fertig zusammengefuehrten .md-Prompt im Ordner prompts/"
        required: true
        type: string
        default: "prompts/grand_fond_parish_church.md"
      run_mode:
        description: "build = GLB direkt auch ohne Fotos; plan_textures = optionaler Codex-Fotoauftrag"
        required: true
        type: choice
        default: build
        options:
          - build
          - plan_textures
      reference_images:
        description: "Bildpfade aus references/ oder referenzbilder/, Komma-getrennt"
        required: false
        type: string
      model:
        description: "Claude-Modell (Kosten aus API-Guthaben)"
        required: true
        type: choice
        default: claude-sonnet-5-5
        options:
          - claude-sonnet-5-5
          - claude-opus-5-5
      review_fixes:
        description: "Maximale visuelle Korrekturrunden je Modellstufe"
        required: true
        type: choice
        default: "2"
        options:
          - "0"
          - "1"
          - "2"

permissions:
  contents: write
  actions: read

concurrency:
  group: claude-blender-${{ inputs.building_name }}
  cancel-in-progress: false

jobs:
  build-asset:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Ubuntu 24.04 Python 3.12 is already present. setup-python must NOT
      # modify the global runtime: Blender may then pick up hostedtoolcache
      # ctypes binaries incompatible with its embedded interpreter.
      - name: Ubuntu-Python pruefen (ohne globales setup-python)
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'

      - name: Fertigen Prompt-Pfad vor kostenpflichtigem Build pruefen
        env:
          PROMPT_PATH: ${{ inputs.prompt_path }}
        run: |
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROMPT_PATH"]).resolve()
          allowed = Path("prompts").resolve()
          if not p.is_relative_to(allowed) or p.suffix.lower() != ".md" or not p.is_file():
              raise SystemExit(f"PROMPT_PATH nicht gefunden oder nicht unter prompts/: {os.environ['PROMPT_PATH']}")
          if p.name == "master_system.md":
              raise SystemExit("Bitte einen fertigen Gebaeudeprompt angeben, nicht master_system.md")
          txt = p.read_text(encoding="utf-8-sig")
          if len(txt.strip()) < 25:
              raise SystemExit(f"Prompt-Datei leer oder zu kurz: {p}")
          print(f"PROMPT_OK: {os.environ['PROMPT_PATH']} ({len(txt)} Zeichen)")
          PY

      - name: Wiederaufnahme-Eingabe prüfen (keine API-Kosten)
        id: resume_guard
        env:
          RESUME_ID_INPUT: ${{ inputs.resume_run_id }}
        run: |
          /usr/bin/python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          raw = os.environ.get("RESUME_ID_INPUT", "").strip()
          if not raw:
              values = "enabled=false\n"
              print("Neuer Build: resume_run_id ist leer; kein Artefakt-Download")
          elif not re.fullmatch(r"[1-9][0-9]{0,17}", raw):
              raise SystemExit("Ungültige resume_run_id: nur positive numerische GitHub-Run-IDs erlaubt")
          elif raw == os.environ.get("GITHUB_RUN_ID"):
              raise SystemExit("resume_run_id darf nicht der aktuell laufende Job sein")
          else:
              values = f"enabled=true\nrun_id={int(raw)}\n"
              print(f"Wiederaufnahme aktiviert für Run-ID {int(raw)}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(values)
          PY

      - name: Frühere Blender-Zwischenstände laden (optional, vor API-Aufrufen)
        if: ${{ steps.resume_guard.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resume_guard.outputs.run_id }}
          pattern: diagnose-${{ inputs.building_name }}-*
          merge-multiple: true
          path: _asset_work/${{ inputs.building_name }}

      - name: Blender und SDK installieren
        run: |
          sudo apt-get update -qq
          # Blender 4.x aus Ubuntu benötigt auf headless Runnern EGL- und GL-Bibliotheken.
          sudo apt-get install -y blender python3-numpy python3-venv libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          /usr/bin/python3 -m venv .agent_venv
          .agent_venv/bin/python -m pip install --upgrade 'anthropic>=0.75' 'Pillow>=10'
          blender --version | head -n 2
          .agent_venv/bin/python -m py_compile scripts/asset_agent.py scripts/blender_worker.py scripts/texture_handoff.py
          blender --version | head -n 1 | grep -E 'Blender 4\.' || (echo 'Blender 4.x benoetigt' && exit 1)
          # Kein Claude-Aufruf, bevor Blender wirklich in headless gestartet werden kann.
          ldconfig -p | grep 'libEGL.so.1'
          # Run under the SAME system-Python isolation as the production worker.
          # --python-exit-code avoids Blender returning rc=0 despite a Python traceback.
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONUSERBASE -u VIRTUAL_ENV \
            PYTHONPATH=/usr/lib/python3/dist-packages \
            timeout 90s blender --background --factory-startup --python-exit-code 37 \
            --python-expr 'import bpy, numpy; print("BLENDER_HEADLESS_NUMPY_OK", numpy.__version__)' \
            | tee /tmp/blender-import-check.log
          grep -F BLENDER_HEADLESS_NUMPY_OK /tmp/blender-import-check.log
          # A real GLB round-trip also tests the actual glTF importer/exporter.
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONUSERBASE -u VIRTUAL_ENV \
            PYTHONPATH=/usr/lib/python3/dist-packages \
            timeout 180s blender --background --factory-startup --python-exit-code 37 \
            --python scripts/blender_lib/smoke_test.py \
            | tee /tmp/blender-roundtrip-check.log
          grep -F BUILDING_KIT_SMOKE_OK /tmp/blender-roundtrip-check.log

          # Exercise the REAL production worker, not only the example exporter.
          # Fail before paid Claude calls if worker import/GLB export/reimport fails.
          mkdir -p "$RUNNER_TEMP/worker-preflight"
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONUSERBASE -u VIRTUAL_ENV \
            PYTHONPATH=/usr/lib/python3/dist-packages \
            WORKER_MODE=export ASSET_WORK="$RUNNER_TEMP/worker-preflight" \
            GLB_PATH="$RUNNER_TEMP/worker-preflight/test.glb" \
            STAGE_REPORT="$RUNNER_TEMP/worker-preflight/report.json" MAX_TRIS=150000 \
            timeout 180s blender --background --factory-startup --python-exit-code 37 \
            "$RUNNER_TEMP/building-kit-worker-source.blend" \
            --python scripts/blender_worker.py | tee /tmp/production-worker-preflight.log
          grep -F EXPORT_REIMPORT_OK /tmp/production-worker-preflight.log


      - name: Automatisch planen, bauen, prüfen und exportieren (kein Go)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUILDING_NAME: ${{ inputs.building_name }}
          PROMPT_PATH: ${{ inputs.prompt_path }}
          REFERENCE_IMAGES: ${{ inputs.reference_images }}
          CLAUDE_MODEL: ${{ inputs.model }}
          REVIEW_FIXES: ${{ inputs.review_fixes }}
          RESUME_RUN_ID: ${{ steps.resume_guard.outputs.run_id }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: .agent_venv/bin/python -u scripts/asset_agent.py

      - name: Automatischen Plan im Actions-Protokoll zusammenfassen
        if: always()
        env:
          BUILDING_NAME: ${{ inputs.building_name }}
        run: |
          if test -s "_asset_work/${BUILDING_NAME}/plan.md"; then
            printf '## Architekturplan (automatisch, kein Go nötig)\n\n' >> "$GITHUB_STEP_SUMMARY"
            head -c 32000 "_asset_work/${BUILDING_NAME}/plan.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnose und QA-Bilder bereitstellen (auch bei Fehler)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-${{ inputs.building_name }}-${{ github.run_number }}
          path: |
            _asset_work/${{ inputs.building_name }}/plan.md
            _asset_work/${{ inputs.building_name }}/input_prompt.md
            _asset_work/${{ inputs.building_name }}/source_fingerprint.txt
            _asset_work/${{ inputs.building_name }}/stage_checkpoints.json
            _asset_work/${{ inputs.building_name }}/usage.json
            _asset_work/${{ inputs.building_name }}/final_validation.json
            _asset_work/${{ inputs.building_name }}/stages/*.log
            _asset_work/${{ inputs.building_name }}/stages/*.json
            _asset_work/${{ inputs.building_name }}/stages/*.py
            _asset_work/${{ inputs.building_name }}/stages/*.blend
            _asset_work/${{ inputs.building_name }}/views/*.png
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Codex-Texturauftrag nach plan_textures in GitHub einchecken
        if: ${{ inputs.run_mode == 'plan_textures' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDING_NAME: ${{ inputs.building_name }}
        run: |
          set -euo pipefail
          test -s "texture_requests/${BUILDING_NAME}/manifest.json"
          test -s "texture_requests/${BUILDING_NAME}/plan.md"
          test -s "texture_requests/${BUILDING_NAME}/CODEX_TASK.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "texture_requests/${BUILDING_NAME}/"
          if git diff --cached --quiet; then
            echo 'Codex-Auftrag unveraendert.'
            exit 0
          fi
          git commit -m "Plan Codex photo texture requests for ${BUILDING_NAME}"
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$HEADER" pull --rebase origin main
          git -c http.extraheader="$HEADER" push origin HEAD:main

      - name: Ausschliesslich fertige Dateien nach inbox committen
        if: ${{ inputs.run_mode == 'build' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDING_NAME: ${{ inputs.building_name }}
        run: |
          set -euo pipefail
          test -s "inbox/${BUILDING_NAME}/${BUILDING_NAME}.glb"
          test -s "inbox/${BUILDING_NAME}/note.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "inbox/${BUILDING_NAME}/"
          if git diff --cached --quiet; then
            echo 'Kein neuer Commit notwendig.'
            exit 0
          fi
          git commit -m "Build Blender UE5 asset ${BUILDING_NAME}"
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$HEADER" pull --rebase origin main
          git -c http.extraheader="$HEADER" push origin HEAD:main
