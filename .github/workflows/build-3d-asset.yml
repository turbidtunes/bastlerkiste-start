name: Claude Blender Gebaeude automatisch bauen

on:
  workflow_dispatch:
    inputs:
      building_name:
        description: "Zielname (lower_snake_case)"
        required: true
        type: string
        default: "grand_fond_parish_church"
      resume_run_id:
        description: "Optional: GitHub-Actions-Run-ID eines fehlgeschlagenen Builds mit Checkpoints (spart Claude-Tokens)"
        required: false
        type: string
      prompt_path:
        description: "Pfad zum fertig zusammengefuehrten .md-Prompt im Ordner prompts/"
        required: true
        type: string
        default: "prompts/grand_fond_parish_church.md"
      reference_images:
        description: "Bildpfade aus references/ oder referenzbilder/, Komma-getrennt"
        required: false
        type: string
      model:
        description: "Claude-Modell (Kosten aus API-Guthaben)"
        required: true
        type: choice
        default: claude-sonnet-5-5
        options:
          - claude-sonnet-5-5
          - claude-opus-5-5
      review_fixes:
        description: "Maximale visuelle Korrekturrunden je Modellstufe"
        required: true
        type: choice
        default: "1"
        options:
          - "0"
          - "1"
          - "2"

permissions:
  contents: write
  actions: read

concurrency:
  group: claude-blender-${{ inputs.building_name }}
  cancel-in-progress: false

jobs:
  build-asset:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fertigen Prompt-Pfad vor kostenpflichtigem Build pruefen
        env:
          PROMPT_PATH: ${{ inputs.prompt_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROMPT_PATH"]).resolve()
          allowed = Path("prompts").resolve()
          if not p.is_relative_to(allowed) or p.suffix.lower() != ".md" or not p.is_file():
              raise SystemExit(f"PROMPT_PATH nicht gefunden oder nicht unter prompts/: {os.environ['PROMPT_PATH']}")
          if p.name == "master_system.md":
              raise SystemExit("Bitte einen fertigen Gebaeudeprompt angeben, nicht master_system.md")
          txt = p.read_text(encoding="utf-8-sig")
          if len(txt.strip()) < 25:
              raise SystemExit(f"Prompt-Datei leer oder zu kurz: {p}")
          print(f"PROMPT_OK: {os.environ['PROMPT_PATH']} ({len(txt)} Zeichen)")
          PY

      - name: Frühere Blender-Zwischenstände laden (optional, vor API-Aufrufen)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          pattern: diagnose-${{ inputs.building_name }}-*
          merge-multiple: true
          path: _asset_work/${{ inputs.building_name }}

      - name: Blender und SDK installieren
        run: |
          sudo apt-get update -qq
          # Blender 4.x aus Ubuntu benötigt auf headless Runnern EGL- und GL-Bibliotheken.
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          python -m pip install --upgrade 'anthropic>=0.75' 'Pillow>=10'
          blender --version | head -n 2
          python -m py_compile scripts/asset_agent.py scripts/blender_worker.py
          blender --version | head -n 1 | grep -E 'Blender 4\.' || (echo 'Blender 4.x benoetigt' && exit 1)
          # Kein Claude-Aufruf, bevor Blender wirklich in headless gestartet werden kann.
          ldconfig -p | grep 'libEGL.so.1'
          timeout 90s blender --background --factory-startup --python-expr 'import bpy, numpy; print("BLENDER_HEADLESS_NUMPY_OK", numpy.__version__)'
          # A real glTF round-trip also tests the bundled glTF exporter and NumPy.
          timeout 180s blender --background --factory-startup --python scripts/blender_lib/smoke_test.py


      - name: Automatisch planen, bauen, prüfen und exportieren (kein Go)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUILDING_NAME: ${{ inputs.building_name }}
          PROMPT_PATH: ${{ inputs.prompt_path }}
          REFERENCE_IMAGES: ${{ inputs.reference_images }}
          CLAUDE_MODEL: ${{ inputs.model }}
          REVIEW_FIXES: ${{ inputs.review_fixes }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: python -u scripts/asset_agent.py

      - name: Automatischen Plan im Actions-Protokoll zusammenfassen
        if: always()
        env:
          BUILDING_NAME: ${{ inputs.building_name }}
        run: |
          if test -s "_asset_work/${BUILDING_NAME}/plan.md"; then
            printf '## Architekturplan (automatisch, kein Go nötig)\n\n' >> "$GITHUB_STEP_SUMMARY"
            head -c 32000 "_asset_work/${BUILDING_NAME}/plan.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnose und QA-Bilder bereitstellen (auch bei Fehler)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-${{ inputs.building_name }}-${{ github.run_number }}
          path: |
            _asset_work/${{ inputs.building_name }}/plan.md
            _asset_work/${{ inputs.building_name }}/input_prompt.md
            _asset_work/${{ inputs.building_name }}/source_fingerprint.txt
            _asset_work/${{ inputs.building_name }}/stage_checkpoints.json
            _asset_work/${{ inputs.building_name }}/usage.json
            _asset_work/${{ inputs.building_name }}/final_validation.json
            _asset_work/${{ inputs.building_name }}/stages/*.log
            _asset_work/${{ inputs.building_name }}/stages/*.json
            _asset_work/${{ inputs.building_name }}/stages/*.py
            _asset_work/${{ inputs.building_name }}/stages/*.blend
            _asset_work/${{ inputs.building_name }}/views/*.png
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Ausschliesslich fertige Dateien nach inbox committen
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDING_NAME: ${{ inputs.building_name }}
        run: |
          set -euo pipefail
          test -s "inbox/${BUILDING_NAME}/${BUILDING_NAME}.glb"
          test -s "inbox/${BUILDING_NAME}/note.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "inbox/${BUILDING_NAME}/"
          if git diff --cached --quiet; then
            echo 'Kein neuer Commit notwendig.'
            exit 0
          fi
          git commit -m "Build Blender UE5 asset ${BUILDING_NAME}"
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$HEADER" pull --rebase origin main
          git -c http.extraheader="$HEADER" push origin HEAD:main
